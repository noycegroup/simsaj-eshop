name: Pripraviť DEV na akceptáciu

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-dev-to-acc
  cancel-in-progress: true

jobs:
  prepare-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Vytvoriť alebo ponechať otvorený PR dev → acc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --base acc --head dev --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Akceptačný PR #$existing už existuje a automaticky obsahuje najnovšie zmeny z dev."
            exit 0
          fi
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base acc \
            --head dev \
            --title "Nasadiť DEV verziu na ACC" \
            --body "Automaticky pripravená propagácia vetvy \`dev\` do \`acc\`. Po kontrole a zlúčení Vercel automaticky nasadí verziu na https://acc.simsaj.sk."
